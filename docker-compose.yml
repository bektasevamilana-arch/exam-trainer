services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exam_trainer}
      POSTGRES_USER: ${POSTGRES_USER:-exam_trainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exam_trainer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-exam_trainer} -d ${POSTGRES_DB:-exam_trainer}"]
      interval: 5s
      timeout: 5s
      retries: 12

  valkey:
    image: valkey/valkey:8-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py load_questions &&
      python manage.py runserver 0.0.0.0:8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exam_trainer}
      POSTGRES_USER: ${POSTGRES_USER:-exam_trainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exam_trainer}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CACHE_URL: redis://valkey:6379/1
      DJANGO_DEBUG: "1"
      ALLOWED_HOSTS: localhost,127.0.0.1,web,0.0.0.0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

volumes:
  postgres_data:
