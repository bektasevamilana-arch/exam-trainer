<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Тренажёр по ОС{% endblock %}</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --accent: #3157d5;
      --error: #b42318;
      --ok: #067647;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }
    main { max-width: 820px; margin: 0 auto; padding: 40px 20px 64px; }
    a { color: var(--accent); }
    h1 { font-size: 2rem; margin: 0 0 12px; }
    h2 { margin-top: 0; }
    .lead { color: var(--muted); margin-top: 0; }
    .card, .question, .result {
      background: var(--card);
      border: 1px solid #e4e7ec;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 16px;
    }
    .topics { display: grid; gap: 16px; margin: 24px 0; }
    .button, button {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
    }
    .button:hover, button:hover { filter: brightness(0.95); }
    .question { border-left: 4px solid #e4e7ec; }
    .question.has-error { border-left-color: var(--error); background: #fffbfa; }
    .question legend { font-weight: 600; padding: 0 6px; }
    .qnum { color: var(--accent); margin-right: 6px; }
    .answers { display: grid; gap: 8px; margin-top: 10px; }
    .answer {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    .answer:hover { background: #f9fafb; }
    .error { color: var(--error); font-weight: 600; margin: 8px 0 0; }
    .hint { color: var(--muted); font-size: 0.875rem; }
    .result.correct { border-left: 4px solid var(--ok); }
    .result.wrong { border-left: 4px solid var(--error); }
    .result p { margin: 6px 0; }
    .explanation { color: var(--muted); }
    .actions { display: flex; gap: 16px; align-items: center; margin-top: 24px; }
    .score { font-size: 2.5rem; color: var(--accent); margin: 0; }
  </style>
</head>
<body>
  <main>
    <p><a href="/">← К списку тем</a></p>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
